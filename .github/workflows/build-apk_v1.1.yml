name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generar APK
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android 35
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Ejecutar pruebas y compilar APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CalculadoraElectrica-v2.0-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraElectrica-APK
          path: CalculadoraElectrica-v2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
