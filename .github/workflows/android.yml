name: Compilar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CalculadoraElectrica.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraElectrica-APK
          path: CalculadoraElectrica.apk
          if-no-files-found: error
          retention-days: 30
